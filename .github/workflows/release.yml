# Build and publish experimental CrawlSpace releases.
name: Test Release

on:
  push:
    tags: ['v*.*.*.*.*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Dragon1473/CrawlSpace-Foundry-VTT'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Build public homebrew and rules compendiums offline.
      # Do not build the private book-text content module.
      - run: npm run packs:homebrew -- --offline
      - run: npm run packs:actions
      - run: npm run packs:space
      - run: npm run packs:hobbies

      - run: npm run release -- "${{ github.ref_name }}"

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/system.json \
            release/system.zip \
            --title "CrawlSpace ${{ github.ref_name }} - Test Build" \
            --generate-notes \
            --verify-tag \
            --prerelease \
            --latest=false